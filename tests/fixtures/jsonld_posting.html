<html lang="en">

    "employmentType": "FULL_TIME",
    "datePosted": "2026-11-01",
    "hiringOrganization": {
      "@type": "Organization",
      "name": "Acme Analytics",
      "logo": "https://acme.example/logo.png"
    },
    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressCountry": "IN"
      }
    },
    "baseSalary": {
      "@type": "MonetaryAmount",
      "currency": "INR",
      "value": { "@type": "QuantitativeValue", "minValue": 1800000, "maxValue": 2400000, "unitText": "YEAR" }
    },
    "educationRequirements": "Bachelor's Degree"
  }
